[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ouestcharlie-py-toolkit"
version = "0.7.0"
description = "Shared Python toolkit for OuEstCharlie agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    { name = "Antoine Hue" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.27",
    "pyexiv2>=2.8",
    "blake3>=1.0.8",
    "pyjwt>=2.12.0", # suggested by dependabot
    "ouestcharlie-imageproc~=1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/ouestcharlie/ouestcharlie"
Issues = "https://github.com/ouestcharlie/ouestcharlie/issues"

[tool.uv.sources]
ouestcharlie-imageproc = { path = "../ouestcharlie-imageproc", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ouestcharlie_toolkit"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
tmp_path_retention_policy = "none"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "pyexiv2.*"
ignore_missing_imports = true
