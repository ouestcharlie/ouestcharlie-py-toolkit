repos:
  - repo: local
    hooks:
      # Ruff runs from the project venv: its version is pinned once, in the dev
      # dependency group (uv.lock), and matches what `uv run ruff` gives by hand.
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      # Runs in the project venv (uv sync first): strict mode needs the real
      # dependencies, which an isolated mirrors-mypy environment would lack.
      # --no-sync: never re-sync (or rebuild) the venv from a commit hook.
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy src
        language: system
        files: ^src/.*\.py$
        pass_filenames: false
